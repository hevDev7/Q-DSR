kind = "web"
previewPath = "/"
title = "Q-DSR Agent Verification"
description = "A professional web dashboard for certifying autonomous trading agents with Monte Carlo bootstrap simulation, PBO, DSR, and onchain audit evidence."
version = "1.0.0"
id = "artifacts/qdsr-verification"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22107

[services.development]
run = "pnpm --filter @workspace/qdsr-verification run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qdsr-verification", "run", "build" ]
serve = "static"
publicDir = "artifacts/qdsr-verification/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22107"
BASE_PATH = "/"
